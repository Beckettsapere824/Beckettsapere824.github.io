<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · Noesyx Lab</title>
  <style>
    :root { --fg:#111; --muted:#555; --line:#e6e6e6; --bg:#fff; --accent:#0b57d0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "PingFang SC", sans-serif; color:var(--fg); background:var(--bg); }
    a { color: var(--accent); text-decoration:none; }
    header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
    header nav { display:flex; gap:16px; font-size:0.92rem; }
    main { max-width:440px; margin:0 auto; padding:40px 20px 80px; }
    h1 { font-size:1.35rem; margin:0 0 8px; }
    .lead { color:var(--muted); font-size:0.95rem; margin:0 0 24px; }
    label { display:block; font-size:0.85rem; margin:12px 0 4px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.95rem; }
    button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:8px; background:#111; color:#fff; font-size:0.95rem; cursor:pointer; }
    button:hover { opacity:0.9; }
    .note { margin-top:20px; padding:12px; background:#f7f7f7; border-radius:8px; font-size:0.85rem; color:var(--muted); }
    .out { margin-top:16px; display:none; padding:12px; border:1px solid var(--line); border-radius:8px; font-size:0.85rem; word-break:break-all; }
    .out code { font-family: ui-monospace, monospace; font-size:0.8rem; }
  </style>
</head>
<body>
  <header>
    <strong><a href="/lab/" style="color:inherit;text-decoration:none">Noesyx Lab</a></strong>
    <nav>
      <a href="/lab/">Home</a>
      <a href="/lab/account/">Account</a>
      <a href="/lab/mcp/">MCP</a>
      <a href="/memo/">Memo</a>
    </nav>
  </header>
  <main>
    <h1>Account</h1>
    <p class="lead">α UI only — no server yet. Submitting generates a <em>local demo</em> token so you can see the flow. Production will mint real tokens after signup.</p>
    <label for="user">Username</label>
    <input id="user" autocomplete="username" placeholder="you">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="new-password" placeholder="••••••••">
    <button type="button" id="go">Create / sign in (demo)</button>
    <div class="out" id="out"></div>
    <p class="note">Password is for the website session only. MCP clients should use the <strong>API token</strong>, never your password. See <a href="/lab/mcp/">MCP setup</a>.</p>
  </main>
  <script>
    document.getElementById('go').onclick = () => {
      const u = (document.getElementById('user').value || 'user').trim();
      const token = 'nl_demo_' + btoa(unescape(encodeURIComponent(u + ':' + Date.now()))).replace(/=+$/,'').slice(0, 24);
      const box = document.getElementById('out');
      box.style.display = 'block';
      box.innerHTML = '<div><strong>Demo token</strong> (not production)</div><code>' + token + '</code><div style="margin-top:8px">MCP URL (placeholder): <code>https://noesyx-lab.com/mcp</code></div><div style="margin-top:8px">Next: open <a href="/lab/mcp/">MCP guide</a> and paste into Grok custom MCP.</div>';
      try { localStorage.setItem('noesyx_demo_token', token); localStorage.setItem('noesyx_demo_user', u); } catch (e) {}
    };
  </script>
</body>
</html>
