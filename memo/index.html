<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memo · Console asset</title>
  <style>
    body { margin: 0; font-family: system-ui, "PingFang SC", sans-serif; background: #fff; color: #111; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 1.05rem; margin: 0; }
    a { color: #06c; }
    #layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
    @media (max-width: 720px) { #layout { grid-template-columns: 1fr; } }
    nav { border-right: 1px solid #ddd; padding: 12px; overflow: auto; font-size: 0.88rem; }
    nav .sec { margin: 10px 0 4px; font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.04em; }
    nav a { display: block; padding: 4px 0; text-decoration: none; color: #333; }
    nav a:hover, nav a.active { color: #06c; font-weight: 600; }
    main { padding: 20px 24px 48px; max-width: 820px; line-height: 1.65; }
    .err { color: #b00; background: #fff0f0; padding: 8px; }
    .hint { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Memo</h1>
    <a href="/console/">Console</a>
    <a href="/">Home</a>
    <a href="https://github.com/Beckettsapere824/ex-memo-rick" target="_blank" rel="noopener">Source</a>
  </header>
  <div id="layout">
    <nav id="nav"></nav>
    <main id="content"><p class="hint">α preview · public nodes only · synth excluded</p><p>Select a node.</p></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script>
    const NODES = [
      "rule-automate-repetition",
      "work-modes-iterate-copy",
      "learn-obsidian-notebooklm",
      "post-eth-fe953493",
      "post-cofounder-d2a9e85b"
    ];
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const sec = document.createElement('div');
    sec.className = 'sec';
    sec.textContent = 'Nodes';
    nav.appendChild(sec);
    NODES.forEach(id => {
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = id;
      a.dataset.id = id;
      a.onclick = (e) => { e.preventDefault(); load(id); };
      nav.appendChild(a);
    });
    async function load(id) {
      if (!NODES.includes(id)) id = NODES[0];
      location.hash = id;
      nav.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
      content.innerHTML = '<p>Loading…</p>';
      try {
        const res = await fetch('md/' + id + '.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        content.innerHTML = marked.parse(await res.text());
      } catch (e) {
        content.innerHTML = '<div class="err">' + e.message + '</div>';
      }
    }
    const initial = location.hash.replace(/^#/, '') || NODES[0];
    if (initial) load(initial);
  </script>
</body>
</html>
